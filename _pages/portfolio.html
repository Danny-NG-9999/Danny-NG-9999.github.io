---
layout: archive
title: "Portfolio"
permalink: /portfolio/
author_profile: true
---

{% include base_path %}

<style>
  /* Responsive Grid Container: Max 3 columns on desktop */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }

  @media (min-width: 992px) {
    .portfolio-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* Compact, short card layout */
  .project-card {
    background-color: #f4f5f7;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    text-decoration: none !important; /* Makes the entire card clickable */
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .project-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
  }

  /* Image Container: Preserves exact image aspect ratio without stretching or cropping */
  .card-image-wrapper {
    width: 100%;
    height: 180px;
    background-color: #ffffff; /* Clean white background behind preview graphics */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
    border-bottom: 1px solid #e5e7eb;
  }

  .card-image-wrapper img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain; /* Ensures complete image fits inside without stretching */
  }

  .no-image-placeholder {
    color: #6b7280;
    font-size: 0.85rem;
    font-weight: 500;
  }

  /* Compact Title-only Content Area */
  .card-content {
    padding: 14px 16px;
    display: flex;
    align-items: center;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.35;
    color: #111827 !important; /* Sharp dark text */
    margin: 0;
  }

  .project-card:hover .card-title {
    color: #2563eb !important; /* Subtle blue hover effect */
  }
</style>

<div class="portfolio-grid">
  {% for post in site.portfolio %}
  <a href="{{ post.url | relative_url }}" class="project-card">
    
    <!-- Image Wrapper (Scales to fit without cropping) -->
    <div class="card-image-wrapper">
      {% if post.header.teaser %}
        <img src="{{ post.header.teaser | relative_url }}" alt="{{ post.title }}">
      {% elsif post.header.image %}
        <img src="{{ post.header.image | relative_url }}" alt="{{ post.title }}">
      {% else %}
        <div class="no-image-placeholder">No Preview Available</div>
      {% endif %}
    </div>

    <!-- Title Only -->
    <div class="card-content">
      <h3 class="card-title">{{ post.title }}</h3>
    </div>

  </a>
  {% endfor %}
</div>
